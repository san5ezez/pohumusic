[package]
name = "pohumusic"
version = "1.0.0"
description = "PohuMusic Windows Desktop Client"
authors = ["san4ezez - tg: @flight_san"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "~2.0.0", features = [] }

[dependencies]
tauri = { version = "~2.0.0", features = ["tray-icon"] }
tauri-plugin-window-state = "~2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
