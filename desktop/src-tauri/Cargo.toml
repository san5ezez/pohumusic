[package]
name = "pohumusic"
version = "1.0.0"
description = "PohuMusic Windows Desktop Client"
authors = ["PohuMusic Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
