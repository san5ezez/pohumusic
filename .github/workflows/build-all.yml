name: PohuMusic Monorepo CI/CD (Backend, Android APK & Windows EXE)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pohumusic-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Cloudflare Workers Backend Tests & Static Assets Build
  # ============================================================================
  backend-and-web:
    name: Backend Tests & Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install root dependencies
        run: npm install

      - name: Run Backend automated test suite (D1 migrations, Auth, Sync, Providers, Recommendations)
        run: npx --yes tsx --test workers/src/tests/*.test.ts

      - name: Build Web Static Frontend
        run: npm run build

      - name: Deploy to Cloudflare Workers (Main Branch)
        if: github.ref == 'refs/heads/main' && secrets.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          # If CLOUDFLARE_D1_DATABASE_ID is provided as a secret, inject it into wrangler.toml
          if [ -n "$CLOUDFLARE_D1_DATABASE_ID" ]; then
            sed -i "s/00000000-0000-0000-0000-000000000001/$CLOUDFLARE_D1_DATABASE_ID/g" wrangler.toml
            echo "Injected CLOUDFLARE_D1_DATABASE_ID secret into wrangler.toml"
          fi

          # Verify if D1 database_id is still the dummy placeholder
          if grep -q "00000000-0000-0000-0000-000000000001" wrangler.toml; then
            echo "::warning::Cloudflare D1 database_id in wrangler.toml is still the placeholder (00000000-0000-0000-0000-000000000001). To deploy live, run 'npx wrangler d1 create pohumusic-db' and add the returned database_id to wrangler.toml or create secret CLOUDFLARE_D1_DATABASE_ID. Skipping remote migration."
          else
            echo "Applying Cloudflare D1 remote migrations..."
            npx wrangler d1 migrations apply pohumusic-db --remote
            echo "Deploying Cloudflare Worker..."
            npx wrangler deploy
          fi

  # ============================================================================
  # 2. Android Client Build (Debug & Release APK via Gradle)
  # ============================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Grant execute permission for gradlew
        working-directory: android
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: pohumusic-android-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          retention-days: 14

  # ============================================================================
  # 3. Windows Desktop Build (Tauri 2 NSIS Installer & Portable EXE)
  # ============================================================================
  build-windows:
    name: Build Windows Desktop EXE
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install Desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows Tauri Bundle (.exe)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: v__VERSION__
          releaseName: 'PohuMusic v__VERSION__'
          releaseBody: 'PohuMusic Windows Desktop & Android Release'
          releaseDraft: false
          prerelease: false

      - name: Upload Windows Executables
        uses: actions/upload-artifact@v4
        with:
          name: pohumusic-windows-exe
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/*.exe
          retention-days: 14
