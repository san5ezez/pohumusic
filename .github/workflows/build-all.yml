name: PohuMusic Monorepo CI/CD (Backend, Android APK & Windows EXE)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pohumusic-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Cloudflare Workers Backend Tests & Static Assets Build
  # ============================================================================
  backend-and-web:
    name: Backend Tests & Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install root dependencies
        run: npm install

      - name: Run Backend automated test suite (D1 migrations, Auth, Sync, Providers, Recommendations)
        run: npx --yes tsx --test workers/src/tests/*.test.ts

      - name: Build Web Static Frontend
        run: npm run build

      - name: Deploy to Cloudflare Workers (Main Branch)
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: node scripts/configure-cloudflare.mjs

  # ============================================================================
  # 2. Android Client Build (Debug & Release APK via Gradle)
  # ============================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

      - name: Grant execute permission for gradlew
        working-directory: android
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: pohumusic-android-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          retention-days: 14

  # ============================================================================
  # 3. Windows Desktop Build (Tauri 2 NSIS Installer & Portable EXE)
  # ============================================================================
  build-windows:
    name: Build Windows Desktop EXE
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install Root Dependencies
        shell: bash
        run: npm install

      - name: Install Desktop Dependencies
        working-directory: ./desktop
        shell: bash
        run: npm install

      - name: Build Desktop Application
        working-directory: ./desktop
        shell: bash
        run: npm run build

      - name: Build Windows Tauri Bundle (.exe)
        working-directory: ./desktop
        shell: bash
        run: npx tauri build --ignore-version-mismatches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_CLI_NO_VERSION_CHECK: "true"
          TAURI_SKIP_VERSION_CHECK: "true"

      - name: Upload Windows Executables
        uses: actions/upload-artifact@v4
        with:
          name: pohumusic-windows-exe
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/*.exe
          if-no-files-found: warn
          retention-days: 14
