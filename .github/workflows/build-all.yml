name: PohuMusic Monorepo CI/CD (Backend, Android APK & Windows EXE)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pohumusic-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Cloudflare Workers Backend Tests & Static Assets Build
  # ============================================================================
  backend-and-web:
    name: Backend Tests & Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install root dependencies
        run: npm install

      - name: Run Backend automated test suite (D1 migrations, Auth, Sync, Providers, Recommendations)
        run: npx --yes tsx --test workers/src/tests/*.test.ts

      - name: Build Web Static Frontend
        run: npm run build

      - name: Deploy to Cloudflare Workers (Main Branch)
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice title=Cloudflare Deploy Skipped::Secret CLOUDFLARE_API_TOKEN is not configured in GitHub repository secrets. To enable automatic deployment to Cloudflare Workers, add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Repository Settings -> Secrets and variables -> Actions."
            exit 0
          fi

          echo "Configuring Cloudflare environment..."

          # 1. Resolve or Create D1 Database
          if [ -n "$CLOUDFLARE_D1_DATABASE_ID" ]; then
            sed -i "s/00000000-0000-0000-0000-000000000001/$CLOUDFLARE_D1_DATABASE_ID/g" wrangler.toml
            echo "Using provided CLOUDFLARE_D1_DATABASE_ID: $CLOUDFLARE_D1_DATABASE_ID"
          elif grep -q "00000000-0000-0000-0000-000000000001" wrangler.toml; then
            echo "D1 database_id has placeholder. Attempting auto-detection / creation of 'pohumusic-db'..."
            CREATE_D1_OUT=$(npx wrangler d1 create pohumusic-db 2>&1 || true)
            DETECTED_D1_ID=$(echo "$CREATE_D1_OUT" | grep -oE '[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}' | head -n 1)
            
            if [ -z "$DETECTED_D1_ID" ]; then
              DETECTED_D1_ID=$(npx wrangler d1 list --json 2>/dev/null | grep -oE '"uuid":\s*"[a-f0-9-]{36}"' | head -n 1 | tr -d '": ' | sed 's/uuid//' || true)
            fi

            if [ -n "$DETECTED_D1_ID" ]; then
              sed -i "s/00000000-0000-0000-0000-000000000001/$DETECTED_D1_ID/g" wrangler.toml
              echo "Auto-configured D1 database_id in wrangler.toml: $DETECTED_D1_ID"
            else
              echo "::warning::Could not automatically detect or create D1 database 'pohumusic-db'. You can create it in Cloudflare Dashboard and add CLOUDFLARE_D1_DATABASE_ID to GitHub Secrets."
            fi
          fi

          # 2. Resolve or Create KV Namespace
          if grep -q "pohumusic_kv_namespace_id" wrangler.toml; then
            echo "Checking KV namespace..."
            CREATE_KV_OUT=$(npx wrangler kv namespace create KV 2>&1 || true)
            DETECTED_KV_ID=$(echo "$CREATE_KV_OUT" | grep -oE 'id = "[a-f0-9]{32}"' | head -n 1 | cut -d'"' -f2 || true)
            
            if [ -z "$DETECTED_KV_ID" ]; then
              DETECTED_KV_ID=$(npx wrangler kv namespace list 2>/dev/null | grep -oE '"id":\s*"[a-f0-9]{32}"' | head -n 1 | tr -d '": ' | sed 's/id//' || true)
            fi

            if [ -n "$DETECTED_KV_ID" ]; then
              sed -i "s/pohumusic_kv_namespace_id/$DETECTED_KV_ID/g" wrangler.toml
              sed -i "s/pohumusic_kv_preview_id/$DETECTED_KV_ID/g" wrangler.toml
              echo "Auto-configured KV namespace ID in wrangler.toml: $DETECTED_KV_ID"
            fi
          fi

          # 3. Apply Remote Migrations if database_id is resolved
          if ! grep -q "00000000-0000-0000-0000-000000000001" wrangler.toml; then
            echo "Applying Cloudflare D1 migrations to remote database..."
            npx wrangler d1 migrations apply pohumusic-db --remote || true
          fi

          # 4. Deploy Cloudflare Worker with Static Assets
          echo "Deploying Cloudflare Worker..."
          npx wrangler deploy

  # ============================================================================
  # 2. Android Client Build (Debug & Release APK via Gradle)
  # ============================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

      - name: Grant execute permission for gradlew
        working-directory: android
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: pohumusic-android-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          retention-days: 14

  # ============================================================================
  # 3. Windows Desktop Build (Tauri 2 NSIS Installer & Portable EXE)
  # ============================================================================
  build-windows:
    name: Build Windows Desktop EXE
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install Desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows Tauri Bundle (.exe)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_CLI_NO_VERSION_CHECK: "true"
          TAURI_SKIP_VERSION_CHECK: "true"
        with:
          projectPath: desktop
          tagName: v__VERSION__
          releaseName: 'PohuMusic v__VERSION__'
          releaseBody: 'PohuMusic Windows Desktop & Android Release'
          releaseDraft: false
          prerelease: false
          args: --ignore-version-mismatches

      - name: Upload Windows Executables
        uses: actions/upload-artifact@v4
        with:
          name: pohumusic-windows-exe
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/*.exe
          if-no-files-found: warn
          retention-days: 14
