name: Deploy PohuMusic Backend to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'workers/**'
      - 'wrangler.toml'
      - 'package.json'

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-deploy:
    name: Verify, Migrate D1 & Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Typecheck codebase
        run: npm run lint

      - name: Run unit & integration tests
        run: npx --yes tsx --test workers/src/tests/backend.test.ts

      - name: Build static frontend assets for Workers Static Assets
        run: npm run build

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN secret is not set. Skipping Cloudflare Workers deployment."
            exit 0
          fi

          if [ -n "$CLOUDFLARE_D1_DATABASE_ID" ]; then
            sed -i "s/00000000-0000-0000-0000-000000000001/$CLOUDFLARE_D1_DATABASE_ID/g" wrangler.toml
            echo "Injected CLOUDFLARE_D1_DATABASE_ID into wrangler.toml"
          fi

          if grep -q "00000000-0000-0000-0000-000000000001" wrangler.toml; then
            echo "::warning::Cloudflare D1 database_id in wrangler.toml is still the placeholder. Skipping remote migration."
          else
            echo "Applying Cloudflare D1 remote migrations..."
            npx wrangler d1 migrations apply pohumusic-db --remote || true
            echo "Deploying Cloudflare Worker..."
            npx wrangler deploy
          fi
